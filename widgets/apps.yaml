# Self-hosted apps: home automation, documents, recipes, dev tools, notes, 3D printing, energy.
# Each entry: needs (required options), headers, optional login, named requests,
# and fields computed with jq over {"<request name>": <response>}. See src/widgets.rs.

# key: a long-lived access token. The `custom` queries of gethomepage are not supported.
homeassistant:
  needs: [key]
  headers: { Authorization: "Bearer {key}" }
  requests:
    states: /api/states
  fields:
    - { label: People Home, key: people_home, format: text, value: '[.states[] | select(.entity_id | startswith("person."))] | "\([.[] | select(.state == "home")] | length) / \(length)"' }
    - { label: Lights On, key: lights_on, format: text, value: '[.states[] | select(.entity_id | startswith("light."))] | "\([.[] | select(.state == "on")] | length) / \(length)"' }
    - { label: Switches On, key: switches_on, format: text, value: '[.states[] | select(.entity_id | startswith("switch."))] | "\([.[] | select(.state == "on")] | length) / \(length)"' }

# key (NC-Token), or username + password.
nextcloud:
  headers:
    NC-Token: "{key}"
    Authorization: "Basic {basic}"
  requests:
    info: /ocs/v2.php/apps/serverinfo/api/v1/info?format=json
  fields:
    - { label: Cpu Load, key: cpuload, hidden: true, format: percent, value: ".info.ocs.data.nextcloud.system.cpuload[0]" }
    - { label: Memory Usage, key: memoryusage, hidden: true, format: percent, value: ".info.ocs.data.nextcloud.system | (.mem_total | tonumber) as $t | ($t - (.mem_free | tonumber)) / $t * 100" }
    - { label: Free Space, key: freespace, format: bytes, value: .info.ocs.data.nextcloud.system.freespace }
    - { label: Active Users, key: activeusers, value: .info.ocs.data.activeUsers.last24hours }
    - { label: Files, key: numfiles, value: .info.ocs.data.nextcloud.storage.num_files }
    - { label: Shared Items, key: numshares, value: .info.ocs.data.nextcloud.shares.num_shares }

# key: an API token, or username + password.
paperlessngx:
  headers:
    Authorization: ["Token {key}", "Basic {basic}"]
  requests:
    stats: /api/statistics/?format=json
  fields:
    - { label: Inbox, key: inbox, when: ".stats.documents_inbox != null", value: .stats.documents_inbox }
    - { label: Total, key: total, value: .stats.documents_total }

# version: 1 (default, /api/groups/statistics) or 2 (Mealie v2+, /api/households/statistics).
mealie:
  needs: [key]
  defaults: { version: "1" }
  computed:
    scope: 'if $options.version == "1" then "groups" else "households" end'
  headers: { Authorization: "Bearer {key}" }
  requests:
    stats: /api/{scope}/statistics
  fields:
    - { label: Recipes, key: recipes, value: .stats.totalRecipes }
    - { label: Users, key: users, value: .stats.totalUsers }
    - { label: Categories, key: categories, value: .stats.totalCategories }
    - { label: Tags, key: tags, value: .stats.totalTags }

tandoor:
  needs: [key]
  headers: { Authorization: "Bearer {key}" }
  requests:
    space: /api/space/
    keyword: /api/keyword/
  fields:
    - { label: Users, key: users, value: "(.space | if type == \"array\" then . else .results end)[0].user_count" }
    - { label: Recipes, key: recipes, value: "(.space | if type == \"array\" then . else .results end)[0].recipe_count" }
    - { label: Keywords, key: keywords, value: .keyword.count }

gitea:
  needs: [key]
  headers: { Authorization: "Bearer {key}" }
  requests:
    notifications: { path: "/api/v1/notifications?limit=1", header: X-Total-Count }
    issues: { path: "/api/v1/repos/issues/search?type=issues&limit=1", header: X-Total-Count }
    pulls: { path: "/api/v1/repos/issues/search?type=pulls&limit=1", header: X-Total-Count }
    repos: { path: "/api/v1/repos/search?limit=1", header: X-Total-Count }
  fields:
    - { label: Notifications, key: notifications, value: .notifications }
    - { label: Issues, key: issues, value: .issues }
    - { label: Pull Requests, key: pulls, value: .pulls }
    - { label: Repositories, key: repositories, value: .repos }

gitlab:
  needs: [key, user_id]
  headers: { PRIVATE-TOKEN: "{key}" }
  requests:
    counts: /api/v4/users/{user_id}/associations_count
  fields:
    - { label: Groups, key: groups, value: .counts.groups_count }
    - { label: Issues, key: issues, value: .counts.issues_count }
    - { label: Merge Requests, key: merges, value: .counts.merge_requests_count }
    - { label: Projects, key: projects, value: .counts.projects_count }

# key: a client token. Messages are counted over the latest page (100 by default), as in gethomepage.
gotify:
  needs: [key]
  headers: { X-Gotify-Key: "{key}" }
  requests:
    apps: /application
    clients: /client
    messages: /message
  fields:
    - { label: Applications, key: apps, value: ".apps | length" }
    - { label: Clients, key: clients, value: ".clients | length" }
    - { label: Messages, key: messages, value: "(.messages.messages // []) | length" }

# Shows the latest message of a topic. Protected topics: key (access token) or username + password.
ntfy:
  needs: [topic]
  headers:
    Authorization: ["Bearer {key}", "Basic {basic}"]
  requests:
    messages: /{topic}/json?poll=1&since=latest
  fields:
    - { label: Title, key: title, format: text, value: '(.messages | objects) // {} | .title // "None"' }
    - { label: Message, key: message, format: text, value: '(.messages | objects) // {} | .message // "None"' }
    - { label: Priority, key: priority, format: text, value: '(.messages | objects) // {} | {"1": "Min", "2": "Low", "3": "Default", "4": "High", "5": "Urgent"}[(.priority // 3) | tostring] // "Default"' }
    - { label: Last Received, key: lastReceived, format: ago, value: '(.messages | objects) // {} | .time // "None"' }
    - { label: Tags, key: tags, hidden: true, format: text, value: '(.messages | objects) // {} | (.tags // []) | if length > 0 then join(", ") else "None" end' }

miniflux:
  needs: [key]
  headers: { X-Auth-Token: "{key}" }
  requests:
    counters: /v1/feeds/counters
  fields:
    - { label: Unread, key: unread, value: "[(.counters.unreads // {})[]] | add // 0" }
    - { label: Read, key: read, value: "[(.counters.reads // {})[]] | add // 0" }

linkwarden:
  needs: [key]
  headers: { Authorization: "Bearer {key}" }
  requests:
    collections: /api/v1/collections
    tags: /api/v1/tags
  fields:
    - { label: Links, key: links, value: '(.collections | if type == "array" then . else .response end) | [.[] | ._count.links // 0] | add // 0' }
    - { label: Collections, key: collections, value: '(.collections | if type == "array" then . else .response end) | length' }
    - { label: Tags, key: tags, value: '(.tags | if type == "array" then . else (.response // .data.tags) end) | length' }

karakeep:
  needs: [key]
  headers: { Authorization: "Bearer {key}" }
  requests:
    stats: /api/v1/users/me/stats
  fields:
    - { label: Bookmarks, key: bookmarks, value: .stats.numBookmarks }
    - { label: Favorites, key: favorites, value: .stats.numFavorites }
    - { label: Archived, key: archived, value: .stats.numArchived }
    - { label: Highlights, key: highlights, value: .stats.numHighlights }
    - { label: Lists, key: lists, hidden: true, value: .stats.numLists }
    - { label: Tags, key: tags, hidden: true, value: .stats.numTags }

# version: 1 (default, /tasks/all) or 2 (Vikunja 0.24+, /tasks). Looks at the first page
# of open tasks (the server's page size), as gethomepage does. Due dates are compared as UTC.
vikunja:
  needs: [key]
  defaults: { version: "1" }
  computed:
    v1: 'if $options.version == "2" then null else "all" end'
    v2: 'if $options.version == "2" then "due_date" else null end'
  headers: { Authorization: "Bearer {key}" }
  requests:
    projects: /api/v1/projects
    tasks_v1: { path: "/api/v1/tasks/{v1}?filter=done%3Dfalse&sort_by=due_date", optional: true }
    tasks_v2: { path: "/api/v1/tasks?filter=done%3Dfalse&sort_by={v2}", optional: true }
  fields:
    - { label: Active Projects, key: projects, value: "[.projects[] | select(.id > 0)] | length" }
    - { label: Tasks Due This Week, key: tasks7d, value: '[(.tasks_v2 // .tasks_v1)[] | select(.due_date != "0001-01-01T00:00:00Z" and .due_date <= (now + 604800 | todate))] | length' }
    - { label: Overdue Tasks, key: tasksOverdue, value: '[(.tasks_v2 // .tasks_v1)[] | select(.due_date != "0001-01-01T00:00:00Z" and .due_date <= (now | todate))] | length' }
    - { label: Tasks In Progress, key: tasksInProgress, value: "[(.tasks_v2 // .tasks_v1)[] | select(.percent_done > 0 and .percent_done < 1)] | length" }

changedetectionio:
  needs: [key]
  headers: { x-api-key: "{key}" }
  requests:
    watch: /api/v1/watch
  fields:
    - { label: Diffs Detected, key: diffsDetected, value: "[.watch[] | select(.last_changed > 0 and (.viewed | not))] | length" }
    - { label: Total Observed, key: totalObserved, value: ".watch | length" }

# Speedtest Tracker (alexjustesen). version: 1 (default, /api/speedtest/latest, Mbps) or
# 2 (/api/v1/results/latest, bytes per second; needs key, an API token).
speedtest:
  defaults: { version: "1" }
  computed:
    v1: 'if $options.version == "2" then null else "speedtest" end'
    v2: 'if $options.version == "2" then "results" else null end'
  headers: { Authorization: "Bearer {key}" }
  requests:
    latest_v1: { path: "/api/{v1}/latest", optional: true }
    latest_v2: { path: "/api/v1/{v2}/latest", optional: true }
  fields:
    - { label: Download, key: download, format: bitrate, value: 'if .latest_v2 then .latest_v2.data.download * 8 else .latest_v1.data.download * 1000000 end' }
    - { label: Upload, key: upload, format: bitrate, value: 'if .latest_v2 then .latest_v2.data.upload * 8 else .latest_v1.data.upload * 1000000 end' }
    - { label: Ping, key: ping, format: text, value: '(.latest_v2 // .latest_v1).data.ping | "\((. * 10 | round) / 10) ms"' }

# password: the MySpeed password, if one is set. Results are in Mbps.
myspeed:
  headers: { Password: "{password}" }
  requests:
    tests: /api/speedtests?limit=1
  fields:
    - { label: Download, key: download, format: bitrate, value: ".tests[0].download * 1000000" }
    - { label: Upload, key: upload, format: bitrate, value: ".tests[0].upload * 1000000" }
    - { label: Ping, key: ping, format: text, value: '"\((.tests[0].ping * 10 | round) / 10) ms"' }

# Auth is optional: username + password (Frigate 0.14+ authenticated port).
frigate:
  login: { path: /api/login, method: POST, json: { user: "{username}", password: "{password}" }, cookie: "frigate_token" }
  headers: { Cookie: "{token}" }
  requests:
    stats: /api/stats
  fields:
    - { label: Cameras, key: cameras, value: "(.stats.cameras // {}) | length" }
    - { label: Uptime, key: uptime, format: duration, value: .stats.service.uptime }
    - { label: Version, key: version, format: text, value: .stats.service.version }

# Auth is optional: username + password, or key (the "authenticated" cookie value).
esphome:
  headers:
    Authorization: "Basic {basic}"
    Cookie: "authenticated={key}"
  requests:
    ping: /ping
  fields:
    - { label: Online, key: online, value: "[.ping[] | select(. == true)] | length" }
    - { label: Offline, key: offline, value: "[.ping[] | select(. == false)] | length" }
    - { label: Not Online, key: offline_alt, value: "[.ping[] | select(. != true)] | length" }
    - { label: Unknown, key: unknown, hidden: true, value: "[.ping[] | select(. == null)] | length" }
    - { label: Total, key: total, value: ".ping | length" }

homebridge:
  needs: [username, password]
  headers: { Authorization: "Bearer {token}" }
  login: { path: /api/auth/login, method: POST, json: { username: "{username}", password: "{password}" }, token: .access_token }
  requests:
    status: /api/status/homebridge
    version: /api/status/homebridge-version
    bridges: /api/status/homebridge/child-bridges
    plugins: /api/plugins
  fields:
    - { label: Status, key: status, format: text, value: ".status.status | (.[:1] | ascii_upcase) + .[1:]" }
    - { label: Updates, key: updates, format: text, value: 'if .version.updateAvailable or ([.plugins[] | select(.updateAvailable)] | length) > 0 then "Update Available" else "Up to Date" end' }
    - { label: Child Bridges, key: child_bridges, when: "(.bridges // []) | length > 0", format: text, value: '(.bridges // []) | "\([.[] | select(.status == "ok")] | length)/\(length)"' }

# Completion is shown while printing (or paused).
octoprint:
  needs: [key]
  requests:
    printer: { path: /api/printer, query: { apikey: "{key}" }, optional: true }   # 409 while the printer is disconnected
    job: { path: /api/job, query: { apikey: "{key}" } }
  fields:
    - { label: Status, key: printer_state, format: text, value: ".printer.state.text // .job.state" }
    - { label: Tool temp, key: temp_tool, format: text, value: '.printer.temperature.tool0.actual | select(. != null) | "\(.) °C"' }
    - { label: Bed temp, key: temp_bed, format: text, value: '.printer.temperature.bed.actual | select(. != null) | "\(.) °C"' }
    - { label: Completion, key: job_completion, when: '.printer.state.text as $s | ["Printing", "Paused", "Pausing", "Resuming"] | any(. == $s)', format: percent, value: .job.progress.completion }

# key: Moonraker API key, only if authorization is enabled.
moonraker:
  headers: { X-Api-Key: "{key}" }
  requests:
    q: /printer/objects/query?print_stats&display_status&webhooks
  fields:
    - { label: Printer State, key: printer_state, when: '.q.result.status.webhooks.state == "shutdown"', format: text, value: .q.result.status.webhooks.state }
    - { label: Layers, key: layers, when: '.q.result.status.webhooks.state != "shutdown"', format: text, value: '.q.result.status.print_stats | if .state == "standby" then "- / -" else "\(.info.current_layer // "-") / \(.info.total_layer // "-")" end' }
    - { label: Progress, key: print_progress, when: '.q.result.status.webhooks.state != "shutdown"', format: percent, value: '.q.result.status | if .print_stats.state == "standby" then null else .display_status.progress * 100 end' }
    - { label: Print Status, key: print_status, when: '.q.result.status.webhooks.state != "shutdown"', format: text, value: .q.result.status.print_stats.state }

mastodon:
  requests:
    instance: /api/v1/instance
  fields:
    - { label: Users, key: user_count, value: .instance.stats.user_count }
    - { label: Posts, key: status_count, value: .instance.stats.status_count }
    - { label: Domains, key: domain_count, value: .instance.stats.domain_count }

# key: the Ghostfolio security token's JWT (Bearer).
ghostfolio:
  needs: [key]
  headers: { Authorization: "Bearer {key}" }
  requests:
    today: /api/v2/portfolio/performance?range=1d
    year: /api/v2/portfolio/performance?range=1y
    max: /api/v2/portfolio/performance?range=max
    user: /api/v1/user
  fields:
    - { label: Today, key: gross_percent_today, format: text, value: '.today.performance | (.netPerformancePercentageWithCurrencyEffect // .grossPerformancePercentage // .currentGrossPerformancePercent) as $p | "\(if $p > 0 then "+" else "" end)\(($p * 10000 | round) / 100)%"' }
    - { label: One year, key: gross_percent_1y, format: text, value: '.year.performance | (.netPerformancePercentageWithCurrencyEffect // .grossPerformancePercentage // .currentGrossPerformancePercent) as $p | "\(if $p > 0 then "+" else "" end)\(($p * 10000 | round) / 100)%"' }
    - { label: All time, key: gross_percent_max, format: text, value: '.max.performance | (.netPerformancePercentageWithCurrencyEffect // .grossPerformancePercentage // .currentGrossPerformancePercent) as $p | "\(if $p > 0 then "+" else "" end)\(($p * 10000 | round) / 100)%"' }
    - { label: Net Worth, key: net_worth, hidden: true, format: text, value: '"\((.today.performance.currentNetWorth * 100 | round) / 100) \(.user.settings.baseCurrency // .user.settings.currency // "")"' }

# Kilowatts, as in the gethomepage widget (grid and charger are clamped at 0).
evcc:
  requests:
    state: /api/state
  fields:
    - { label: Production, key: pv_power, format: text, value: '(.state.result // .state) as $d | "\(([$d.pvPower // 0, 0] | max) / 100 | round / 10) kW"' }
    - { label: Grid, key: grid_power, format: text, value: '(.state.result // .state) as $d | "\(([$d.gridPower // $d.grid.power // 0, 0] | max) / 100 | round / 10) kW"' }
    - { label: Consumption, key: home_power, format: text, value: '(.state.result // .state) as $d | "\(([$d.homePower // 0, 0] | max) / 100 | round / 10) kW"' }
    - { label: Charger, key: charge_power, format: text, value: '(.state.result // .state) as $d | "\(([[($d.loadpoints // [])[] | .chargePower // 0] | add // 0, 0] | max) / 100 | round / 10) kW"' }

# Basic auth is optional (username + password).
opendtu:
  headers: { Authorization: "Basic {basic}" }
  requests:
    live: /api/livedata/status
  fields:
    - { label: Today, key: yieldDay, format: text, value: '"\(.live.total.YieldDay.v | round) \(.live.total.YieldDay.u)"' }
    - { label: Power %, key: relativePower, format: percent, value: '([.live.inverters[]? | .limit_absolute // 0] | add // 0) as $l | if $l > 0 then (.live.total.Power.v / $l * 100 | round) else null end' }
    - { label: Power, key: absolutePower, format: text, value: '"\(.live.total.Power.v | round) \(.live.total.Power.u)"' }
    - { label: Limit, key: limit, format: text, value: '"\([.live.inverters[]? | .limit_absolute // 0] | add // 0 | round) W"' }

homebox:
  needs: [username, password]
  headers: { Authorization: "{token}" }
  login: { path: /api/v1/users/login, method: POST, form: { username: "{username}", password: "{password}" }, token: .token }
  requests:
    stats: /api/v1/groups/statistics
    group: /api/v1/groups
  fields:
    - { label: Items, key: items, value: .stats.totalItems }
    - { label: With Warranty, key: totalWithWarranty, hidden: true, value: .stats.totalWithWarranty }
    - { label: Locations, key: locations, value: .stats.totalLocations }
    - { label: Labels, key: labels, hidden: true, value: .stats.totalLabels }
    - { label: Users, key: users, hidden: true, value: .stats.totalUsers }
    - { label: Total Value, key: totalValue, format: text, value: '"\((.stats.totalItemPrice * 100 | round) / 100) \(.group.currency // "")"' }

wallos:
  needs: [key]
  computed:
    prev_month: '(now | strftime("%Y-%m-01T00:00:00Z") | fromdateiso8601) - 86400 | strftime("%m") | tonumber | tostring'
    prev_year: '(now | strftime("%Y-%m-01T00:00:00Z") | fromdateiso8601) - 86400 | strftime("%Y")'
    this_month: 'now | strftime("%m") | tonumber | tostring'
    this_year: 'now | strftime("%Y")'
    next_month: '(now | strftime("%Y-%m-01T00:00:00Z") | fromdateiso8601) + 32 * 86400 | strftime("%m") | tonumber | tostring'
    next_year: '(now | strftime("%Y-%m-01T00:00:00Z") | fromdateiso8601) + 32 * 86400 | strftime("%Y")'
  requests:
    subs: /api/subscriptions/get_subscriptions.php?api_key={key}&state=0&sort=next_payment
    prev: { path: "/api/subscriptions/get_monthly_cost.php", query: { api_key: "{key}", month: "{prev_month}", year: "{prev_year}" }, optional: true }
    this: { path: "/api/subscriptions/get_monthly_cost.php", query: { api_key: "{key}", month: "{this_month}", year: "{this_year}" }, optional: true }
    next: { path: "/api/subscriptions/get_monthly_cost.php", query: { api_key: "{key}", month: "{next_month}", year: "{next_year}" }, optional: true }
  fields:
    - { label: Subscriptions, key: activeSubscriptions, value: ".subs.subscriptions | length" }
    - { label: Next Payment, key: nextRenewingSubscription, format: text, value: ".subs.subscriptions[0].name" }
    - { label: Prev. Month, key: previousMonthlyCost, hidden: true, format: text, value: ".prev.localized_monthly_cost" }
    - { label: This Month, key: thisMonthlyCost, format: text, value: ".this.localized_monthly_cost" }
    - { label: Next Month, key: nextMonthlyCost, format: text, value: ".next.localized_monthly_cost" }

# key: an ETAPI token.
trilium:
  needs: [key]
  headers: { Authorization: "{key}" }
  requests:
    metrics: /etapi/metrics?format=json
  fields:
    - { label: Version, key: version, format: text, value: '.metrics.version.app | if . then "v\(.)" else "Unknown" end' }
    - { label: Notes, key: notesCount, value: ".metrics.database.activeNotes // 0" }
    - { label: Database Size, key: dbSize, format: bytes, value: ".metrics.statistics.databaseSizeBytes // 0" }

syncthing:
  needs: [key]
  headers: { X-API-Key: "{key}" }
  requests:
    connections: /rest/system/connections
    completion: /rest/db/completion
    error: /rest/system/error
  fields:
    - { label: Connected, key: connected, format: text, value: '.connections.connections | [.[]] | "\([.[] | select(.connected)] | length) / \(length)"' }
    - { label: Synced, key: synced, format: percent, value: .completion.completion }
    - { label: Errors, key: errors, value: "(.error.errors // []) | length" }
    - { label: Storage, key: storage, format: bytes, value: .completion.globalBytes }

# Basic auth is optional (username + password). vehicleID: show a single vehicle
# (Vehicle and Next Reminder instead of Vehicles).
lubelogger:
  defaults: { vehicleID: "" }
  headers: { Authorization: "Basic {basic}" }
  requests:
    vehicles: /api/vehicle/info
  fields:
    - { label: Vehicles, key: vehicles, when: '$options.vehicleID == ""', value: ".vehicles | length" }
    - { label: Vehicle, key: vehicle, when: '$options.vehicleID != ""', format: text, value: '[.vehicles[] | select(.vehicleData.id | tostring == $options.vehicleID)][0].vehicleData | "\(.year) \(.model)"' }
    - { label: Service Records, key: serviceRecords, value: '[.vehicles[] | select($options.vehicleID == "" or (.vehicleData.id | tostring) == $options.vehicleID) | .serviceRecordCount // 0] | add // 0' }
    - { label: Reminders, key: reminders, value: '[.vehicles[] | select($options.vehicleID == "" or (.vehicleData.id | tostring) == $options.vehicleID) | (.veryUrgentReminderCount // 0) + (.urgentReminderCount // 0) + (.notUrgentReminderCount // 0)] | add // 0' }
    - { label: Next Reminder, key: nextReminder, when: '$options.vehicleID != ""', format: text, value: '[.vehicles[] | select(.vehicleData.id | tostring == $options.vehicleID)][0] | select(. != null) | if .nextReminder then .nextReminder.dueDate[:10] else "None" end' }

# Summary of all spools (the per-spool blocks of gethomepage need dynamic labels).
spoolman:
  requests:
    spools: /api/v1/spool
  fields:
    - { label: Spools, value: ".spools | length" }
    - { label: Remaining, format: text, value: '[.spools[] | .remaining_weight // 0] | add // 0 | "\(round) g"' }
    - { label: Lowest, format: text, value: '[.spools[] | select((.initial_weight // 0) > 0) | {n: .filament.name, p: ((.remaining_weight // 0) / .initial_weight * 100)}] | min_by(.p) | select(. != null) | "\(.n) \(.p | round)%"' }

booklore:
  needs: [username, password]
  headers: { Authorization: "Bearer {token}" }
  login: { path: /api/v1/auth/login, method: POST, json: { username: "{username}", password: "{password}" }, token: .accessToken }
  requests:
    libraries: /api/v1/libraries
    books: /api/v1/books
  fields:
    - { label: Libraries, key: libraries, value: ".libraries | length" }
    - { label: Books, key: books, value: ".books | length" }
    - { label: Reading, key: reading, value: '[.books[] | select((.readStatus // "") | ascii_upcase == "READING")] | length' }
    - { label: Finished, key: finished, value: '[.books[] | select((.readStatus // "") | ascii_upcase == "READ")] | length' }

# interval: day, week (default), month (30 days), year or all.
yourspotify:
  needs: [key]
  defaults: { interval: week }
  computed:
    since: 'if $options.interval == "all" then "2006-04-23T00:00:00.000Z" else now - ({day: 86400, week: 604800, month: 2592000, year: 31536000}[$options.interval] // 604800) | strftime("%Y-%m-%dT%H:%M:%S.000Z") end'
  requests:
    songs: /spotify/songs_per?token={key}&start={since}&timeSplit=all
    time: /spotify/time_per?token={key}&start={since}&timeSplit=all
    artists: /spotify/different_artists_per?token={key}&start={since}&timeSplit=all
  fields:
    - { label: Songs, key: songs, value: ".songs[0].count // 0" }
    - { label: Time, key: time, format: duration, value: "(.time[0].count // 0) / 1000" }
    - { label: Artists, key: artists, value: "(.artists[0].artists // []) | length" }

# API at https://dev.azure.com (set url only to override). key: a personal access token (or username +
# password, the PAT as password). Latest build of definitionId (branchName optional).
# Pull request stats need repositoryId and userEmail.
azuredevops:
  needs: [organization, project, definitionId]
  defaults: { url: "https://dev.azure.com", key: "", userEmail: "" }
  computed:
    pat: '$options.key | select(. != null and . != "") | "$:\(.)" | @base64'
  headers: { Authorization: ["Basic {pat}", "Basic {basic}"] }
  requests:
    builds: { path: "/{organization}/{project}/_apis/build/Builds", query: { branchName: "{branchName}", definitions: "{definitionId}" } }
    prs: { path: "/{organization}/{project}/_apis/git/repositories/{repositoryId}/pullrequests", optional: true }
  fields:
    - { label: Result, key: result, when: ".builds.value[0].result != null", format: text, value: '.builds.value[0].result | tostring as $r | {succeeded: "Succeeded", partiallySucceeded: "Partially Succeeded", notStarted: "Not Started", failed: "Failed", canceled: "Canceled", inProgress: "In Progress", completed: "Completed", cancelling: "Cancelling", postponed: "Postponed", none: "None"}[$r] // $r' }
    - { label: Status, key: status, when: ".builds.value[0].result == null", format: text, value: '.builds.value[0].status | tostring as $r | {succeeded: "Succeeded", partiallySucceeded: "Partially Succeeded", notStarted: "Not Started", failed: "Failed", canceled: "Canceled", inProgress: "In Progress", completed: "Completed", cancelling: "Cancelling", postponed: "Postponed", none: "None"}[$r] // $r' }
    - { label: Total PRs, key: totalPrs, when: '$options.userEmail != "" and $options.repositoryId != null', value: '.prs.count' }
    - { label: My PRs, key: myPrs, when: '$options.userEmail != "" and $options.repositoryId != null', value: '[.prs.value[] | select((.createdBy.uniqueName | ascii_downcase) == ($options.userEmail | ascii_downcase))] | length' }
    - { label: Approved, key: approved, when: '$options.userEmail != "" and $options.repositoryId != null', value: '[.prs.value[] | select((.createdBy.uniqueName | ascii_downcase) == ($options.userEmail | ascii_downcase)) | select([.reviewers[] | select(.vote == 5 or .vote == 10)] | length > 0)] | length' }

pterodactyl:
  needs: [key]
  headers: { Authorization: "Bearer {key}" }
  requests:
    nodes: /api/application/nodes?include=servers
  fields:
    - { label: Nodes, key: nodes, value: ".nodes.data | length" }
    - { label: Servers, key: servers, value: "[.nodes.data[] | (.attributes.relationships.servers.data // []) | length] | add // 0" }

freshrss:
  needs: [username, password]
  headers: { Authorization: "GoogleLogin auth={token}" }
  login: { path: /api/greader.php/accounts/ClientLogin, method: POST, form: { Email: "{username}", Passwd: "{password}" }, token: 'capture("Auth=(?<t>.+)").t' }
  requests:
    subs: /api/greader.php/reader/api/0/subscription/list?output=json
    unread: /api/greader.php/reader/api/0/unread-count?output=json
  fields:
    - { label: Unread, key: unread, value: .unread.max }
    - { label: Subscriptions, key: subscriptions, value: "(.subs.subscriptions // []) | length" }

# authHeader (proxy header auth) is not supported.
filebrowser:
  needs: [username, password]
  headers: { X-AUTH: "{token}" }
  login: { path: /api/login, method: POST, json: { username: "{username}", password: "{password}" }, token: . }
  requests:
    usage: /api/usage
  fields:
    - { label: Available, key: available, format: bytes, value: "(.usage.total // 0) - (.usage.used // 0)" }
    - { label: Used, key: used, format: bytes, value: ".usage.used // 0" }
    - { label: Total, key: total, format: bytes, value: ".usage.total // 0" }

# Current month. Net worth is the first currency reported by Firefly III.
firefly:
  needs: [key]
  headers: { Authorization: "Bearer {key}" }
  computed:
    month_start: 'now | strftime("%Y-%m-01")'
    month_end: '(now | strftime("%Y-%m-01T00:00:00Z") | fromdateiso8601) + 32 * 86400 | strftime("%Y-%m-01T00:00:00Z") | fromdateiso8601 | . - 86400 | strftime("%Y-%m-%d")'
  requests:
    summary: { path: /api/v1/summary/basic, query: { start: "{month_start}", end: "{month_end}" } }
    budgets: { path: /api/v1/available-budgets, query: { start: "{month_start}", end: "{month_end}" } }
  fields:
    - { label: Net Worth, key: networth, format: text, value: '[.summary | to_entries[] | select(.key | contains("net-worth-in")) | .value.value_parsed][0]' }
    - { label: Budget, key: budget, format: text, value: '.budgets.data[0] | select(.type == "available_budgets") | .attributes | "\(.currency_symbol) \((-((.spent_in_budgets[0].sum // "0") | tonumber) * 100 | round) / 100) / \(.currency_symbol) \((.amount | tonumber * 100 | round) / 100)"' }
