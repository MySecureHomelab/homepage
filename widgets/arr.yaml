# *arr stack and request managers.
# Each entry: needs (required options), headers, optional login, named requests,
# and fields computed with jq over {"<request name>": <response>}. See src/widgets.rs.

sonarr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    wanted: /api/v3/wanted/missing
    queue: /api/v3/queue
    series: /api/v3/series
  fields:
    - { label: Wanted, value: .wanted.totalRecords }
    - { label: Queued, value: .queue.totalRecords }
    - { label: Series, value: .series | length }

radarr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    movies: /api/v3/movie
    queue: /api/v3/queue/status
  fields:
    - { label: Wanted, value: "[.movies[] | select(.monitored and (.hasFile | not) and .isAvailable)] | length" }
    - { label: Missing, value: "[.movies[] | select(.monitored and (.hasFile | not))] | length" }
    - { label: Queued, value: .queue.totalCount }
    - { label: Movies, value: "[.movies[] | select(.hasFile)] | length" }

lidarr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    wanted: /api/v1/wanted/missing
    queue: /api/v1/queue/status
    artists: /api/v1/artist
  fields:
    - { label: Wanted, value: .wanted.totalRecords }
    - { label: Queued, value: .queue.totalCount }
    - { label: Artists, value: .artists | length }

readarr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    wanted: /api/v1/wanted/missing
    queue: /api/v1/queue/status
    books: /api/v1/book
  fields:
    - { label: Wanted, value: .wanted.totalRecords }
    - { label: Queued, value: .queue.totalCount }
    - { label: Books, value: "[.books[] | select((.statistics.bookFileCount // 0) > 0)] | length" }

prowlarr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    stats: /api/v1/indexerstats
  fields:
    - { label: Grabs, value: "[(.stats.indexers // [])[].numberOfGrabs // 0] | add // 0" }
    - { label: Queries, value: "[(.stats.indexers // [])[].numberOfQueries // 0] | add // 0" }
    - { label: Fail Grabs, value: "[(.stats.indexers // [])[].numberOfFailedGrabs // 0] | add // 0" }
    - { label: Fail Queries, value: "[(.stats.indexers // [])[].numberOfFailedQueries // 0] | add // 0" }

bazarr:
  needs: [key]
  requests:
    episodes: { path: /api/episodes/wanted, query: { apikey: "{key}" } }
    movies: { path: /api/movies/wanted, query: { apikey: "{key}" } }
  fields:
    - { label: Missing Episodes, value: .episodes.total }
    - { label: Missing Movies, value: .movies.total }

# The key must stay in the query string. With an admin password set, a session cookie is used.
jackett:
  needs: [key]
  login: { path: /UI/Dashboard, method: POST, form: { password: "{password}" }, cookie: Jackett }
  headers: { Cookie: "{token}" }
  requests:
    indexers: { path: /api/v2.0/indexers, query: { apikey: "{key}", configured: "true" } }
  fields:
    - { label: Configured, value: .indexers | length }
    - { label: Errored, value: "[.indexers[] | select(.last_error)] | length" }

# Mylar only accepts the key in the query string.
mylar:
  needs: [key]
  requests:
    series: { path: /api, query: { cmd: seriesjsonListing, apikey: "{key}" } }
    issues: { path: /api, query: { cmd: getIndex, apikey: "{key}" } }
    wanted: { path: /api, query: { cmd: getWanted, apikey: "{key}" } }
  fields:
    - { label: Series, value: ".series.data | length" }
    - { label: Issues, value: "[.issues.data[].totalIssues // 0] | add // 0" }
    - { label: Wanted, value: ".wanted.issues | length" }

# Medusa puts the key in the path.
medusa:
  needs: [key]
  requests:
    stats: /api/v1/{key}/?cmd=shows.stats
    future: /api/v1/{key}/?cmd=future
  fields:
    - { label: Wanted, value: "[.future.data | (.later, .missed, .soon, .today) | length] | add" }
    - { label: Queued, value: .stats.data.ep_snatched }
    - { label: Series, value: .stats.data.shows_active }

seerr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    requests: /api/v1/request/count
    issues: /api/v1/issue/count
  fields:
    - { label: Pending, value: .requests.pending }
    - { label: Approved, value: .requests.approved }
    - { label: Available, value: .requests.available }
    - { label: Completed, value: ".requests.completed // .requests.available" }
    - { label: Processing, value: .requests.processing }
    - { label: Open Issues, value: '"\(.issues.open) / \(.issues.total)"', format: text }

overseerr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    requests: /api/v1/request/count
  fields:
    - { label: Pending, value: .requests.pending }
    - { label: Processing, value: .requests.processing }
    - { label: Approved, value: .requests.approved }
    - { label: Available, value: .requests.available }

jellyseerr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    requests: /api/v1/request/count
    issues: /api/v1/issue/count
  fields:
    - { label: Pending, value: .requests.pending }
    - { label: Approved, value: .requests.approved }
    - { label: Available, value: .requests.available }
    - { label: Completed, value: ".requests.completed // .requests.available" }
    - { label: Processing, value: .requests.processing }
    - { label: Open Issues, value: '"\(.issues.open) / \(.issues.total)"', format: text }

ombi:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    requests: /api/v1/Request/count
  fields:
    - { label: Pending, value: .requests.pending }
    - { label: Approved, value: .requests.approved }
    - { label: Available, value: .requests.available }

autobrr:
  needs: [key]
  headers: { X-API-Token: "{key}" }
  requests:
    stats: /api/release/stats
    filters: /api/filters
    indexers: /api/release/indexers
  fields:
    - { label: Approved, value: .stats.push_approved_count }
    - { label: Rejected, value: .stats.push_rejected_count }
    - { label: Filters, value: ".filters | length" }
    - { label: Indexers, value: ".indexers | length" }

# Maintainerr has no authentication.
maintainerr:
  requests:
    metrics: /api/storage-metrics
  fields:
    - { label: Items Handled, value: ".metrics.cleanupTotals.itemsHandled // 0" }
    - { label: Episodes Handled, value: ".metrics.cleanupTotals.episodesHandled // 0" }
    - { label: Movies Handled, value: ".metrics.cleanupTotals.moviesHandled // 0" }
    - { label: Shows Handled, value: ".metrics.cleanupTotals.showsHandled // 0" }
    - { label: Seasons Handled, value: ".metrics.cleanupTotals.seasonsHandled // 0" }
    - { label: Reclaimable, value: ".metrics.collectionSummary.activeSizeBytes // 0", format: bytes }
    - { label: Movie Reclaimable, value: ".metrics.collectionSummary.movieSizeBytes // 0", format: bytes }
    - { label: Show Reclaimable, value: ".metrics.collectionSummary.showSizeBytes // 0", format: bytes }
    - { label: Total Capacity, value: ".metrics.totals.totalSpace // 0", format: bytes }

sportarr:
  needs: [key]
  requests:
    wanted: { path: /api/wanted/missing, query: { apikey: "{key}" } }
    queue: { path: /api/queue, query: { apikey: "{key}" } }
    leagues: { path: /api/leagues, query: { apikey: "{key}" } }
  fields:
    - { label: Wanted, value: .wanted.totalRecords }
    - { label: Queued, value: ".queue | length" }
    - { label: Leagues, value: ".leagues | length" }
