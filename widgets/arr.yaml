# *arr stack and request managers.
# Each entry: needs (required options), headers, optional login, named requests,
# and fields computed with jq over {"<request name>": <response>}. See src/widgets.rs.

sonarr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    wanted: /api/v3/wanted/missing
    queue: /api/v3/queue
    series: /api/v3/series
  fields:
    - { label: Wanted, key: wanted, value: .wanted.totalRecords }
    - { label: Queued, key: queued, value: .queue.totalRecords }
    - { label: Series, key: series, value: .series | length }

radarr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    movies: /api/v3/movie
    queue: /api/v3/queue/status
  fields:
    - { label: Wanted, key: wanted, value: "[.movies[] | select(.monitored and (.hasFile | not) and .isAvailable)] | length" }
    - { label: Missing, key: missing, value: "[.movies[] | select(.monitored and (.hasFile | not))] | length" }
    - { label: Queued, key: queued, value: .queue.totalCount }
    - { label: Movies, key: movies, value: "[.movies[] | select(.hasFile)] | length" }

lidarr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    wanted: /api/v1/wanted/missing
    queue: /api/v1/queue/status
    artists: /api/v1/artist
  fields:
    - { label: Wanted, key: wanted, value: .wanted.totalRecords }
    - { label: Queued, key: queued, value: .queue.totalCount }
    - { label: Artists, key: artists, value: .artists | length }

readarr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    wanted: /api/v1/wanted/missing
    queue: /api/v1/queue/status
    books: /api/v1/book
  fields:
    - { label: Wanted, key: wanted, value: .wanted.totalRecords }
    - { label: Queued, key: queued, value: .queue.totalCount }
    - { label: Books, key: books, value: "[.books[] | select((.statistics.bookFileCount // 0) > 0)] | length" }

prowlarr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    stats: /api/v1/indexerstats
  fields:
    - { label: Grabs, key: numberOfGrabs, value: "[(.stats.indexers // [])[].numberOfGrabs // 0] | add // 0" }
    - { label: Queries, key: numberOfQueries, value: "[(.stats.indexers // [])[].numberOfQueries // 0] | add // 0" }
    - { label: Fail Grabs, key: numberOfFailGrabs, value: "[(.stats.indexers // [])[].numberOfFailedGrabs // 0] | add // 0" }
    - { label: Fail Queries, key: numberOfFailQueries, value: "[(.stats.indexers // [])[].numberOfFailedQueries // 0] | add // 0" }

bazarr:
  needs: [key]
  requests:
    episodes: { path: /api/episodes/wanted, query: { apikey: "{key}" } }
    movies: { path: /api/movies/wanted, query: { apikey: "{key}" } }
  fields:
    - { label: Missing Episodes, key: missingEpisodes, value: .episodes.total }
    - { label: Missing Movies, key: missingMovies, value: .movies.total }

# Set password when Jackett has an admin password (session cookie); key is optional.
jackett:
  login: { path: /UI/Dashboard, method: POST, form: { password: "{password}" }, cookie: Jackett }
  headers: { Cookie: "{token}" }
  requests:
    indexers: { path: /api/v2.0/indexers, query: { apikey: "{key}", configured: "true" } }
  fields:
    - { label: Configured, key: configured, value: .indexers | length }
    - { label: Errored, key: errored, value: "[.indexers[] | select(.last_error)] | length" }

# Mylar only accepts the key in the query string.
mylar:
  needs: [key]
  requests:
    series: { path: /api, query: { cmd: seriesjsonListing, apikey: "{key}" } }
    issues: { path: /api, query: { cmd: getIndex, apikey: "{key}" } }
    wanted: { path: /api, query: { cmd: getWanted, apikey: "{key}" } }
  fields:
    - { label: Series, key: series, value: ".series.data | length" }
    - { label: Issues, key: issues, value: "[.issues.data[].totalIssues // 0] | add // 0" }
    - { label: Wanted, key: wanted, value: ".wanted.issues | length" }

# Medusa puts the key in the path.
medusa:
  needs: [key]
  requests:
    stats: /api/v1/{key}/?cmd=shows.stats
    future: /api/v1/{key}/?cmd=future
  fields:
    - { label: Wanted, key: wanted, value: "[.future.data | (.later, .missed, .soon, .today) | length] | add" }
    - { label: Queued, key: queued, value: .stats.data.ep_snatched }
    - { label: Series, key: series, value: .stats.data.shows_active }

seerr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    requests: /api/v1/request/count
    issues: /api/v1/issue/count
  fields:
    - { label: Pending, key: pending, value: .requests.pending }
    - { label: Approved, key: approved, value: .requests.approved }
    - { label: Available, key: available, value: .requests.available, hidden: true }
    - { label: Completed, key: completed, value: .requests.completed }
    - { label: Processing, key: processing, value: .requests.processing, hidden: true }
    - { label: Open Issues, key: issues, value: '"\(.issues.open) / \(.issues.total)"', format: text, hidden: true }

overseerr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    requests: /api/v1/request/count
  fields:
    - { label: Pending, key: pending, value: .requests.pending }
    - { label: Processing, key: processing, value: .requests.processing }
    - { label: Approved, key: approved, value: .requests.approved }
    - { label: Available, key: available, value: .requests.available }

# Jellyseerr is now Seerr: same API, same fields as seerr.
jellyseerr:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    requests: /api/v1/request/count
    issues: /api/v1/issue/count
  fields:
    - { label: Pending, key: pending, value: .requests.pending }
    - { label: Approved, key: approved, value: .requests.approved }
    - { label: Available, key: available, value: .requests.available, hidden: true }
    - { label: Completed, key: completed, value: .requests.completed }
    - { label: Processing, key: processing, value: .requests.processing, hidden: true }
    - { label: Open Issues, key: issues, value: '"\(.issues.open) / \(.issues.total)"', format: text, hidden: true }

ombi:
  needs: [key]
  headers: { X-Api-Key: "{key}" }
  requests:
    requests: /api/v1/Request/count
  fields:
    - { label: Pending, key: pending, value: .requests.pending }
    - { label: Approved, key: approved, value: .requests.approved }
    - { label: Available, key: available, value: .requests.available }

autobrr:
  needs: [key]
  headers: { X-API-Token: "{key}" }
  requests:
    stats: /api/release/stats
    filters: /api/filters
    indexers: /api/release/indexers
  fields:
    - { label: Approved, key: approvedPushes, value: .stats.push_approved_count }
    - { label: Rejected, key: rejectedPushes, value: .stats.push_rejected_count }
    - { label: Filters, key: filters, value: ".filters | length" }
    - { label: Indexers, key: indexers, value: ".indexers | length" }

# Maintainerr has no authentication.
maintainerr:
  requests:
    metrics: /api/storage-metrics
  fields:
    - { label: Items Handled, key: itemsHandled, value: ".metrics.cleanupTotals.itemsHandled // 0" }
    - { label: Episodes Handled, key: episodesHandled, value: ".metrics.cleanupTotals.episodesHandled // 0" }
    - { label: Movies Handled, key: moviesHandled, value: ".metrics.cleanupTotals.moviesHandled // 0" }
    - { label: Shows Handled, key: showsHandled, value: ".metrics.cleanupTotals.showsHandled // 0", hidden: true }
    - { label: Seasons Handled, key: seasonsHandled, value: ".metrics.cleanupTotals.seasonsHandled // 0", hidden: true }
    - { label: Reclaimable, key: reclaimable, value: ".metrics.collectionSummary.activeSizeBytes // 0", format: bytes }
    - { label: Movie Reclaimable, key: movieReclaimable, value: ".metrics.collectionSummary.movieSizeBytes // 0", format: bytes, hidden: true }
    - { label: Show Reclaimable, key: showReclaimable, value: ".metrics.collectionSummary.showSizeBytes // 0", format: bytes, hidden: true }
    - { label: Total Capacity, key: totalCapacity, value: ".metrics.totals.totalSpace // 0", format: bytes, hidden: true }

sportarr:
  needs: [key]
  requests:
    wanted: { path: /api/wanted/missing, query: { apikey: "{key}", page: "1", pageSize: "1" } }
    queue: { path: /api/queue, query: { apikey: "{key}" } }
    leagues: { path: /api/leagues, query: { apikey: "{key}" } }
  fields:
    - { label: Wanted, key: wanted, value: .wanted.totalRecords }
    - { label: Queued, key: queued, value: ".queue | length" }
    - { label: Leagues, key: leagues, value: ".leagues | length" }
