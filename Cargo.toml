[package]
name = "homepage"
version = "0.1.1"
edition = "2024"

[dependencies]
actix-web = "4.18.1"
askama = "0.16.1"
base64 = "0.23.1"
bollard = "0.21.1"
jaq-core = "3.1.2"
jaq-json = "2.0.3"
jaq-std = "3.0.4"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["time", "net", "rt", "sync"] }

[profile.release]
strip = true
lto = true
