[package]
name = "homepage"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.18.1"
askama = "0.16.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["time", "net", "rt", "sync"] }

[profile.release]
strip = true
lto = true
